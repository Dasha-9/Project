{% extends 'base.html' %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<div class="col-12">
<style>
.login-wrapper { max-width: 420px; margin: 60px auto; padding: 0 20px; }
.login-logo { text-align: center; margin-bottom: 28px; }
.login-logo-icon { width: 64px; height: 64px; background: #1a2744; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 12px; border-bottom: 3px solid #c5973a; }
.login-logo-text { font-size: 0.75rem; color: #8899bb; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
.login-card { background: #fff; border: 1px solid #dde3ec; border-top: 4px solid #2c3e6b; border-radius: 3px; overflow: hidden; }
.login-card-header { background: #f4f6fb; border-bottom: 1px solid #dde3ec; padding: 20px 32px; text-align: center; }
.login-card-title { color: #1a2744; font-size: 1.1rem; font-weight: 700; margin: 0; }
.login-card-body { padding: 28px 32px; }
.field-label { font-size: 0.78rem; font-weight: 700; color: #3a4a6b; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; display: block; }
.form-control { border: 1px solid #ccd3e0; border-radius: 2px; font-size: 0.9rem; padding: 10px 12px; color: #1a2744; width: 100%; }
.form-control:focus { border-color: #2c3e6b; box-shadow: 0 0 0 3px rgba(44,62,107,0.1); outline: none; }
.login-error { background: #fdf2f2; border: 1px solid #f0c0bb; border-radius: 2px; padding: 10px 14px; font-size: 0.85rem; color: #c0392b; margin-bottom: 16px; }
.btn-login { background: #2c3e6b; color: #fff; border: none; padding: 12px; font-size: 0.9rem; font-weight: 600; border-radius: 2px; width: 100%; cursor: pointer; transition: background 0.2s; letter-spacing: 0.3px; }
.btn-login:hover { background: #c5973a; }
.login-footer { text-align: center; padding: 16px 32px; background: #f4f6fb; border-top: 1px solid #dde3ec; font-size: 0.78rem; color: #8899bb; }
</style>

<div class="login-wrapper">
    <div class="login-logo">
        <div class="login-logo-icon">📚</div>
        <div class="login-logo-text">Архив документов</div>
    </div>
    <div class="login-card">
        <div class="login-card-header">
            <h2 class="login-card-title">🔐 Вход в систему</h2>
        </div>
        <div class="login-card-body">
            {% if form.errors %}
            <div class="login-error">⚠️ Неверный логин или пароль. Попробуйте снова.</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="field-label" for="username">Логин</label>
                    <input type="text" name="username" id="username" class="form-control" placeholder="Введите логин" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="field-label" for="password">Пароль</label>
                    <input type="password" name="password" id="password" class="form-control" placeholder="Введите пароль" required>
                </div>
                <button type="submit" class="btn-login">Войти в систему</button>
            </form>
        </div>
        <div class="login-footer">Доступ только для авторизованных сотрудников</div>
    </div>
</div>
</div>
{% endblock %}
