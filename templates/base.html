<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Архив документов{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }
        .filter-group {
            margin-bottom: 20px;
        }
        .filter-group label {
            font-weight: bold;
            margin-bottom: 8px;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'documents:document_list' %}">📚 Архив документов</a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <span class="nav-link text-light">👤 {{ user.username }}</span>
                    <a class="nav-link" href="{% url 'documents:document_create' %}">➕ Добавить документ</a>
                    <a class="nav-link" href="/admin/">🔧 Админка</a>
                    <a class="nav-link" href="{% url 'logout' %}">🚪 Выйти</a>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">🔐 Войти</a>
                {% endif %}
            </div>
        </div>
    </nav>
    
    <div class="container">
        <div class="row">
            {% block content %}{% endblock %}
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
